[package]
name = "my_sql"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "iguana-mysql"
path = "src/main.rs"
test = false

[dependencies]
iguana-runtime = { version = "=0.1.0-alpha.4", features = ["cli"] }
rustc-hash = "2.1.1"
serde_json = "1.0"

[features]
debug-trace = ["iguana-runtime/debug-trace"]
instrument = ["iguana-runtime/instrument"]
dhat-heap = ["iguana-runtime/dhat-heap"]
profile = ["iguana-runtime/profile"]
